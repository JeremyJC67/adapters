[project]
name = "harbor-contractbench-adapter"
version = "0.1.0"
description = "Harbor adapter for ContractBench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Running the parity agent (contractbench.parity_agent) under Harbor.
parity = ["harbor==0.25.0", "openai>=1.40"]

[project.scripts]
contractbench = "contractbench.main:main"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contractbench"]
