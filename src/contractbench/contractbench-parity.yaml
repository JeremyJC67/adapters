# Parity configuration for the matched-agent experiment in parity_experiment.json.
#
# n_attempts: 3 runs every task three times in one job, i.e. three full runs.
# Run it once; do not repeat the command three times.
#
# The agent is a Harbor port of ContractBench's own tool-calling loop
# (src/contractbench/parity_agent.py), so both sides run the same agent and only
# the harness differs. It runs on the host and calls the OpenAI API directly, so
# OPENAI_API_KEY (and OPENAI_BASE_URL, if needed) must be set in the shell that
# launches Harbor; no key is passed into the task containers.
jobs_dir: jobs
n_attempts: 3
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 8
  quiet: true
environment:
  type: docker
  force_build: false
  delete: true
agents:
  - import_path: contractbench.parity_agent:ContractBenchParityAgent
    model_name: openai/gpt-4o-2024-08-06
    # The original-side parity runs used `run_task_docker.py --timeout 600`, a
    # soft deadline checked before each model call. The agent enforces the same
    # deadline itself; Harbor's hard limit sits above it so it never cuts a
    # trial short.
    kwargs:
      agent_timeout_sec: 600
    override_timeout_sec: 1200

  # Standard Harbor agent on the same tasks (generalization run, not parity):
  # - name: mini-swe-agent
  #   model_name: openai/gpt-4o-2024-08-06
  #   kwargs:
  #     config:
  #       agent:
  #         step_limit: 30
  #       model:
  #         model_kwargs:
  #           temperature: 0.0
datasets:
  - path: datasets/contractbench
